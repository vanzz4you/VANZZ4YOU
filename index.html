<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscribe DanxyBot</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        p {
            font-size: 1.2rem;
            color: #aaaaaa;
            margin-bottom: 30px;
        }

        .btn-subscribe {
            background-color: #ff0000;
            color: white;
            padding: 15px 30px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
            transition: transform 0.3s, background-color 0.3s;
        }

        .btn-subscribe:hover {
            background-color: #cc0000;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <h1>DanxyBot</h1>
    <p>Dukung terus channel ini dengan cara subscribe!</p>
    
    <a href="https://www.youtube.com/@DanxyOfficial" class="btn-subscribe" target="_blank">
        SUBSCRIBE SEKARANG
    </a>

</body>
</html>
